# =============================================================================
# GitHub Actions - Build and Deploy
# =============================================================================
# Builds and deploys backend to Google Cloud Run and frontend to Vercel.
# Called by CI pipeline after all tests pass.
#
# Pipeline: deploy-backend → health-check-backend → deploy-frontend → health-check-frontend
# If the backend health check fails, the frontend never deploys.
# =============================================================================

name: Build and Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: "Deployment environment"
        required: false
        default: "production"
        type: string
    secrets:
      GCP_PROJECT_ID:
        required: true
      GCP_REGION:
        required: true
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      GEMINI_API_KEY:
        required: false
      VITE_FIREBASE_API_KEY:
        required: true
      VITE_FIREBASE_AUTH_DOMAIN:
        required: true
      VITE_FIREBASE_PROJECT_ID:
        required: true
      VITE_FIREBASE_STORAGE_BUCKET:
        required: true
      VITE_FIREBASE_MESSAGING_SENDER_ID:
        required: true
      VITE_FIREBASE_APP_ID:
        required: true
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true

  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options: [production, staging]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  BACKEND_SERVICE: resume-builder-backend

jobs:
  # ===========================================================================
  # Job 1: Deploy Backend to Cloud Run
  # ===========================================================================
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    outputs:
      backend_url: ${{ steps.deploy-backend.outputs.backend_url }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}

      - name: Docker Auth
        uses: docker/login-action@v3
        with:
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.auth_token }}
          registry: ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Backend
        run: |
          BACKEND_IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/resume-builder/${{ env.BACKEND_SERVICE }}:${{ github.sha }}"
          docker build --tag "${BACKEND_IMAGE}" -f server/Dockerfile ./server
          docker push "${BACKEND_IMAGE}"
          echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> $GITHUB_ENV

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy Backend
        id: deploy-backend
        run: |
          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --image=${{ env.BACKEND_IMAGE }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --set-env-vars="NODE_ENV=production,GEMINI_API_KEY=${{ env.GEMINI_API_KEY }},FRONTEND_URL=https://makeownresume.vercel.app"

          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format="value(status.url)")
          echo "backend_url=${BACKEND_URL}" >> $GITHUB_OUTPUT
          echo "Backend deployed to: ${BACKEND_URL}"

  # ===========================================================================
  # Job 2: Backend Health Check
  # ===========================================================================
  health-check-backend:
    name: Backend Health Check
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Wait for service to stabilize
        run: sleep 15

      - name: Check Backend Health
        id: backend-health
        run: |
          BACKEND_URL="${{ needs.deploy-backend.outputs.backend_url }}"
          echo "Checking backend at: ${BACKEND_URL}/api/v1/health"

          HTTP_STATUS=$(curl -s -o /tmp/backend-response.json -w "%{http_code}" \
            --max-time 30 --retry 3 --retry-delay 5 \
            "${BACKEND_URL}/api/v1/health")

          echo "Backend response: HTTP ${HTTP_STATUS}"
          cat /tmp/backend-response.json

          if [[ "$HTTP_STATUS" -ge 200 && "$HTTP_STATUS" -lt 300 ]]; then
            echo "✅ Backend is healthy (HTTP ${HTTP_STATUS})"
            echo "healthy=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Backend health check failed (HTTP ${HTTP_STATUS})"
            echo "healthy=false" >> $GITHUB_OUTPUT
            exit 1
          fi

  # ===========================================================================
  # Job 3: Deploy Frontend to Vercel
  # ===========================================================================
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [deploy-backend, health-check-backend]
    outputs:
      frontend_url: ${{ steps.deploy-frontend.outputs.frontend_url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Project Config
        run: vercel pull --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VITE_API_URL: ${{ needs.deploy-backend.outputs.backend_url }}
          VITE_API_VERSION: v1
          VITE_NODE_ENV: production
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Deploy to Vercel
        id: deploy-frontend
        run: |
          FRONTEND_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "frontend_url=${FRONTEND_URL}" >> $GITHUB_OUTPUT
          echo "Frontend deployed to: ${FRONTEND_URL}"

  # ===========================================================================
  # Job 4: Frontend Health Check
  # ===========================================================================
  health-check-frontend:
    name: Frontend Health Check
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    steps:
      - name: Wait for deployment to propagate
        run: sleep 15

      - name: Check Frontend Health
        id: frontend-health
        run: |
          FRONTEND_URL="${{ needs.deploy-frontend.outputs.frontend_url }}"
          echo "Checking frontend at: ${FRONTEND_URL}"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 --retry 3 --retry-delay 5 \
            "${FRONTEND_URL}")

          echo "Frontend response: HTTP ${HTTP_STATUS}"

          if [[ "$HTTP_STATUS" -ge 200 && "$HTTP_STATUS" -lt 400 ]]; then
            echo "✅ Frontend is healthy (HTTP ${HTTP_STATUS})"
            echo "healthy=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Frontend health check failed (HTTP ${HTTP_STATUS})"
            echo "healthy=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Deployment Summary
        if: always()
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL | Health |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.deploy-backend.outputs.backend_url }} | ✅ Healthy |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.deploy-frontend.outputs.frontend_url }} | ${{ steps.frontend-health.outputs.healthy == 'true' && '✅ Healthy' || '❌ Unhealthy' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
